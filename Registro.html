<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🔐 Registro Movimenti — Ranch Bar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);}
.login-box{background:white;border-radius:16px;padding:40px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center;}
.login-box h1{font-size:1.4rem;font-weight:900;margin-bottom:4px;color:#1e293b;}
.login-box p{font-size:.85rem;color:#64748b;margin-bottom:24px;}
.login-box input{width:100%;padding:11px 14px;border:1.5px solid #cbd5e1;border-radius:9px;font-size:.95rem;outline:none;margin-bottom:12px;}
.login-box input:focus{border-color:#f97316;}
.login-box button{width:100%;background:#f97316;color:white;border:none;border-radius:9px;padding:12px;font-size:.95rem;font-weight:700;cursor:pointer;}
.login-box button:hover{background:#ea580c;}
.login-err{color:#ef4444;font-size:.82rem;margin-top:8px;display:none;}

/* MAIN */
#main-screen{display:none;}
#header{background:#0f172a;padding:14px 24px;display:flex;align-items:center;gap:12px;}
#header h1{color:white;font-size:1.1rem;font-weight:900;}
#header .badge{background:#f97316;color:white;border-radius:20px;padding:3px 12px;font-size:.78rem;font-weight:700;}
#sync{font-size:.75rem;padding:4px 10px;border-radius:10px;font-weight:700;margin-left:auto;}
.ok{background:#14532d;color:#4ade80;} .err{background:#4a1a1a;color:#f87171;}
#clock{font-family:monospace;font-size:.95rem;color:#fbbf24;font-weight:700;}
#btn-logout{background:#334155;color:#94a3b8;border:none;border-radius:7px;padding:6px 14px;font-size:.78rem;cursor:pointer;}

.container{max-width:1100px;margin:0 auto;padding:20px 16px;}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:white;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid #f97316;}
.kpi.green{border-left-color:#22c55e;} .kpi.blue{border-left-color:#3b82f6;} .kpi.red{border-left-color:#ef4444;} .kpi.purple{border-left-color:#a855f7;}
.kpi-lbl{font-size:.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;}
.kpi-val{font-size:1.4rem;font-weight:900;color:#1e293b;margin-top:4px;}
.kpi-sub{font-size:.7rem;color:#cbd5e1;margin-top:2px;}

/* FILTRI */
.filtri{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filtri input,.filtri select{padding:8px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.82rem;outline:none;background:white;}
.filtri input:focus,.filtri select:focus{border-color:#f97316;}
.btn-export{background:#2563eb;color:white;border:none;border-radius:8px;padding:8px 16px;font-size:.8rem;font-weight:700;cursor:pointer;margin-left:auto;}

/* TABELLA */
.log-table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08);}
.log-table th{background:#0f172a;color:white;padding:10px 14px;font-size:.76rem;text-align:left;}
.log-table td{padding:9px 14px;font-size:.78rem;border-bottom:1px solid #f1f5f9;vertical-align:top;}
.log-table tr:hover td{background:#fafafa;}
.log-table tr:last-child td{border-bottom:none;}
.ev-pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:.72rem;font-weight:700;white-space:nowrap;}
.det-json{font-size:.72rem;color:#64748b;font-family:monospace;max-width:300px;word-break:break-word;}
.tav-badge{background:#1e293b;color:#fbbf24;border-radius:8px;padding:2px 8px;font-size:.72rem;font-weight:700;}
.imp-pos{color:#16a34a;font-weight:700;}
.imp-neg{color:#dc2626;font-weight:700;}
.orario{font-family:monospace;font-size:.74rem;color:#64748b;white-space:nowrap;}

/* REALTIME indicator */
.rt-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* PAGINATION */
.pagination{display:flex;gap:8px;justify-content:center;margin-top:16px;align-items:center;}
.page-btn{border:1.5px solid #e2e8f0;background:white;border-radius:7px;padding:6px 14px;font-size:.82rem;font-weight:700;cursor:pointer;}
.page-btn.active{background:#0f172a;color:white;border-color:#0f172a;}
.page-btn:hover:not(.active){border-color:#f97316;color:#f97316;}
.page-info{font-size:.8rem;color:#64748b;}

#toast{position:fixed;bottom:20px;right:20px;background:#22c55e;color:white;border-radius:10px;padding:10px 18px;font-weight:700;font-size:.85rem;transform:translateY(100px);transition:transform .3s;z-index:999;}
#toast.show{transform:translateY(0);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>🔐 Registro Movimenti</h1>
    <p>Ranch Bar — Accesso riservato</p>
    <input type="password" id="pwd-input" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Accedi</button>
    <div class="login-err" id="login-err">❌ Password errata</div>
  </div>
</div>

<!-- MAIN -->
<div id="main-screen">
  <div id="header">
    <h1>🔐 Registro Movimenti — Ranch Bar</h1>
    <span class="badge">RISERVATO</span>
    <span class="rt-dot"></span>
    <span id="sync" class="ok">🟢 Live</span>
    <div id="clock"></div>
    <button id="btn-logout" onclick="logout()">Esci</button>
  </div>

  <div class="container">
    <!-- KPI -->
    <div class="kpi-grid" id="kpi-grid"></div>

    <!-- FILTRI -->
    <div class="filtri">
      <input type="date" id="f-from" onchange="renderLog()">
      <span style="font-size:.8rem;color:#94a3b8;">→</span>
      <input type="date" id="f-to" onchange="renderLog()">
      <select id="f-evento" onchange="renderLog()">
        <option value="">Tutti gli eventi</option>
        <option value="PAGAMENTO">💰 Pagamenti</option>
        <option value="ELIMINA_SCONTRINO">❌ Scontrini eliminati</option>
        <option value="RIMOZIONE_ARTICOLO">🗑️ Articoli rimossi</option>
        <option value="LIBERA_TAVOLO">🔓 Tavoli liberati</option>
        <option value="APERTURA_TAVOLO">🟢 Aperture tavolo</option>
        <option value="NUOVO_PRODOTTO">➕ Nuovi prodotti</option>
        <option value="MODIFICA_PRODOTTO">✏️ Prodotti modificati</option>
        <option value="ELIMINA_PRODOTTO">🗑️ Prodotti eliminati</option>
        <option value="MODIFICA_COPERTO">⚙️ Modifiche coperto</option>
        <option value="STATO_ORDINE">📋 Ordini cucina/bar</option>
      </select>
      <select id="f-tavolo" onchange="renderLog()">
        <option value="">Tutti i tavoli</option>
      </select>
      <button style="background:#64748b;color:white;border:none;border-radius:7px;padding:7px 14px;font-size:.8rem;cursor:pointer;" onclick="resetFiltri()">✕ Reset</button>
      <button class="btn-export" onclick="esportaCsv()">⬇️ Esporta CSV</button>
    </div>

    <!-- TABELLA -->
    <table class="log-table">
      <thead>
        <tr>
          <th style="width:140px">Data/Ora</th>
          <th style="width:180px">Evento</th>
          <th style="width:90px">Tavolo</th>
          <th style="width:100px">Importo</th>
          <th>Dettaglio</th>
        </tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>

    <div class="pagination" id="pagination"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPA_URL='https://wfvpunzvmoisuaeryffg.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmdnB1bnp2bW9pc3VhZXJ5ZmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMzc5OTAsImV4cCI6MjA5OTYxMzk5MH0.5-dRvP52uRMnOxkiecNIdH1on0N3_2aHEdV8awSYbIQ';
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);

// ── PASSWORD (cambia questa con la tua) ───────────────────────────
const PASSWORD_HASH = btoa('0812'); // password: RanchBar2024!

const EVENTO_INFO = {
  "APERTURA_TAVOLO":     ["🟢","Apertura tavolo",    "#dcfce7","#166534"],
  "LIBERA_TAVOLO":       ["🔓","Tavolo liberato",     "#f0fdf4","#15803d"],
  "PAGAMENTO":           ["💰","Pagamento",            "#fefce8","#854d0e"],
  "RIMOZIONE_ARTICOLO":  ["🗑️","Articolo rimosso",   "#fff7ed","#9a3412"],
  "ELIMINA_SCONTRINO":   ["❌","Scontrino eliminato", "#fef2f2","#991b1b"],
  "NUOVO_PRODOTTO":      ["➕","Nuovo prodotto",       "#eff6ff","#1e40af"],
  "MODIFICA_PRODOTTO":   ["✏️","Prodotto modificato", "#f0f9ff","#0369a1"],
  "ELIMINA_PRODOTTO":    ["🗑️","Prodotto eliminato",  "#fef2f2","#991b1b"],
  "MODIFICA_COPERTO":    ["⚙️","Coperto modificato",  "#faf5ff","#7e22ce"],
  "STATO_ORDINE_PRONTO": ["✅","Ordine pronto",        "#f0fdf4","#15803d"],
  "STATO_ORDINE_CONSEGNATO":["📦","Consegnato",        "#f8fafc","#475569"],
};

let logs=[], page=1;
const PER_PAGE=50;

// ── AUTH ──────────────────────────────────────────────────────────
function login(){
  const pwd=document.getElementById('pwd-input').value;
  if(btoa(pwd)===PASSWORD_HASH){
    sessionStorage.setItem('ranchbar_auth','1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('main-screen').style.display='block';
    init();
  } else {
    document.getElementById('login-err').style.display='block';
    document.getElementById('pwd-input').value='';
    document.getElementById('pwd-input').focus();
  }
}
function logout(){
  sessionStorage.removeItem('ranchbar_auth');
  location.reload();
}
document.getElementById('pwd-input').addEventListener('keydown',e=>{if(e.key==='Enter')login();});

// Auto-login se già autenticato
if(sessionStorage.getItem('ranchbar_auth')==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-screen').style.display='block';
}

// ── CLOCK ──────────────────────────────────────────────────────────
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleString('it-IT');}
setInterval(updateClock,1000);

// ── LOAD ──────────────────────────────────────────────────────────
async function carica(){
  try{
    const{data,error}=await supa.from('audit_log').select('*').order('creato_il',{ascending:false}).limit(2000);
    if(error) throw error;
    logs=data||[];
    popolaTavoli();
    renderKPI();
    renderLog();
    document.getElementById('sync').className='ok';
    document.getElementById('sync').textContent='🟢 Live';
  }catch(e){
    document.getElementById('sync').className='err';
    document.getElementById('sync').textContent='🔴 Offline';
  }
}

function popolaTavoli(){
  const tavoli=[...new Set(logs.filter(l=>l.tavolo).map(l=>l.tavolo))].sort((a,b)=>{
    const na=parseInt(a)||0, nb=parseInt(b)||0;
    return na-nb||a.localeCompare(b);
  });
  const sel=document.getElementById('f-tavolo');
  const cur=sel.value;
  sel.innerHTML='<option value="">Tutti i tavoli</option>'+tavoli.map(t=>`<option${cur===t?' selected':''}>${t}</option>`).join('');
}

// ── KPI ───────────────────────────────────────────────────────────
function renderKPI(){
  const oggi=new Date().toISOString().slice(0,10);
  const logsOggi=logs.filter(l=>l.creato_il?.slice(0,10)===oggi);
  const totIncasso=logs.filter(l=>l.evento==='PAGAMENTO').reduce((s,l)=>s+(l.importo||0),0);
  const incassoOggi=logsOggi.filter(l=>l.evento==='PAGAMENTO').reduce((s,l)=>s+(l.importo||0),0);
  const scontriniEl=logs.filter(l=>l.evento==='ELIMINA_SCONTRINO').length;
  const articoliRim=logs.filter(l=>l.evento==='RIMOZIONE_ARTICOLO').length;
  const prodMod=logs.filter(l=>['MODIFICA_PRODOTTO','ELIMINA_PRODOTTO','NUOVO_PRODOTTO'].includes(l.evento)).length;

  document.getElementById('kpi-grid').innerHTML=`
    <div class="kpi"><div class="kpi-lbl">💰 Incasso Totale</div><div class="kpi-val">€ ${totIncasso.toFixed(2).replace('.',',')}</div><div class="kpi-sub">tutti i periodi</div></div>
    <div class="kpi green"><div class="kpi-lbl">📅 Incasso Oggi</div><div class="kpi-val">€ ${incassoOggi.toFixed(2).replace('.',',')}</div><div class="kpi-sub">${logsOggi.filter(l=>l.evento==='PAGAMENTO').length} scontrini</div></div>
    <div class="kpi red"><div class="kpi-lbl">❌ Scontrini Eliminati</div><div class="kpi-val">${scontriniEl}</div><div class="kpi-sub">totale storico</div></div>
    <div class="kpi blue"><div class="kpi-lbl">🗑️ Articoli Rimossi</div><div class="kpi-val">${articoliRim}</div><div class="kpi-sub">dal conto</div></div>
    <div class="kpi purple"><div class="kpi-lbl">✏️ Modifiche Prodotti</div><div class="kpi-val">${prodMod}</div><div class="kpi-sub">aggiunte/modif./elim.</div></div>
    <div class="kpi"><div class="kpi-lbl">📋 Tot. Movimenti</div><div class="kpi-val">${logs.length}</div><div class="kpi-sub">in archivio</div></div>
  `;
}

// ── RENDER LOG ────────────────────────────────────────────────────
function renderLog(){
  const from=document.getElementById('f-from').value;
  const to=document.getElementById('f-to').value;
  const evento=document.getElementById('f-evento').value;
  const tavolo=document.getElementById('f-tavolo').value;

  let filtered=logs.filter(l=>{
    if(from && l.creato_il?.slice(0,10)<from) return false;
    if(to   && l.creato_il?.slice(0,10)>to)   return false;
    if(evento && !l.evento.startsWith(evento)) return false;
    if(tavolo && l.tavolo!==tavolo)            return false;
    return true;
  });

  const total=filtered.length;
  const pages=Math.ceil(total/PER_PAGE)||1;
  if(page>pages) page=1;
  const slice=filtered.slice((page-1)*PER_PAGE, page*PER_PAGE);

  const tbody=document.getElementById('log-body');
  if(!slice.length){
    tbody.innerHTML='<tr><td colspan="5" style="text-align:center;padding:40px;color:#94a3b8;">Nessun movimento trovato</td></tr>';
  } else {
    tbody.innerHTML=slice.map(l=>{
      const info=EVENTO_INFO[l.evento]||['📋',l.evento,'#f8fafc','#475569'];
      const data=new Date(l.creato_il);
      const dataStr=data.toLocaleDateString('it-IT')+' '+data.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const det=l.dettaglio||{};
      // Formatta dettaglio in modo leggibile
      let detStr='';
      if(l.evento==='PAGAMENTO') detStr=`${det.articoli||0} articoli · ${det.persone||0} coperti · Pag: ${det.pagamento||'—'}`;
      else if(l.evento==='RIMOZIONE_ARTICOLO') detStr=`${det.articolo||'—'} (x${det.qty||1})`;
      else if(l.evento==='ELIMINA_SCONTRINO') detStr=`Scontrino #${String(det.scontrino_id||'').slice(-6)} · ${det.pagamento||'—'}`;
      else if(l.evento==='MODIFICA_PRODOTTO'||l.evento==='NUOVO_PRODOTTO') detStr=`${det.nome||'—'} · € ${Number(det.prezzo||0).toFixed(2)} · ${det.cat||'—'}`;
      else if(l.evento==='ELIMINA_PRODOTTO') detStr=`${det.nome||'—'} (€ ${Number(det.prezzo||0).toFixed(2)})`;
      else if(l.evento==='MODIFICA_COPERTO') detStr=`€ ${Number(det.vecchio_prezzo||0).toFixed(2)} → € ${Number(det.nuovo_prezzo||0).toFixed(2)}`;
      else if(l.evento==='STATO_ORDINE_PRONTO'||l.evento==='STATO_ORDINE_CONSEGNATO') detStr=`${det.articolo||'—'} (x${det.quantita||1})${det.note?' 📝'+det.note:''}`;
      else detStr=JSON.stringify(det).slice(0,80);

      const imp=l.importo!=null?`<span class="${l.importo>=0?'imp-pos':'imp-neg'}">€ ${Number(l.importo).toFixed(2).replace('.',',')}</span>`:'<span style="color:#cbd5e1">—</span>';

      return `<tr>
        <td class="orario">${dataStr}</td>
        <td><span class="ev-pill" style="background:${info[2]};color:${info[3]};">${info[0]} ${info[1]}</span></td>
        <td>${l.tavolo?`<span class="tav-badge">T${l.tavolo}</span>`:'<span style="color:#cbd5e1">—</span>'}</td>
        <td>${imp}</td>
        <td class="det-json">${detStr}</td>
      </tr>`;
    }).join('');
  }

  // Pagination
  const pg=document.getElementById('pagination');
  pg.innerHTML=`
    <button class="page-btn" onclick="goPage(${page-1})" ${page<=1?'disabled style="opacity:.3"':''}>◀</button>
    <span class="page-info">Pag. ${page} / ${pages} (${total} eventi)</span>
    <button class="page-btn" onclick="goPage(${page+1})" ${page>=pages?'disabled style="opacity:.3"':''}>▶</button>
  `;
}

function goPage(p){
  const pages=Math.ceil(document.querySelectorAll('#log-body tr').length>0?1:1);
  page=Math.max(1,p); renderLog();
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetFiltri(){
  document.getElementById('f-from').value='';
  document.getElementById('f-to').value='';
  document.getElementById('f-evento').value='';
  document.getElementById('f-tavolo').value='';
  page=1; renderLog();
}

// ── EXPORT CSV ────────────────────────────────────────────────────
function esportaCsv(){
  const rows=[['Data/Ora','Evento','Tavolo','Importo','Utente','Dettaglio']];
  logs.forEach(l=>rows.push([
    new Date(l.creato_il).toLocaleString('it-IT'),
    l.evento, l.tavolo||'',
    l.importo!=null?l.importo.toFixed(2):'',
    l.utente||'',
    JSON.stringify(l.dettaglio||{})
  ]));
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='registro_movimenti_'+new Date().toLocaleDateString('it-IT').replace(/\//g,'-')+'.csv';
  a.click();
}

// ── REALTIME ──────────────────────────────────────────────────────
function avviaRealtime(){
  supa.channel('audit_rt')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'audit_log'},p=>{
      logs.unshift(p.new);
      renderKPI(); renderLog();
      const t=document.getElementById('toast');
      const info=EVENTO_INFO[p.new.evento]||['📋',p.new.evento,'',''];
      t.textContent=info[0]+' '+info[1];
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'),2500);
    })
    .subscribe(s=>{
      document.getElementById('sync').className=s==='SUBSCRIBED'?'ok':'err';
      document.getElementById('sync').textContent=s==='SUBSCRIBED'?'🟢 Live':'🔴 Offline';
    });
}

// ── INIT ──────────────────────────────────────────────────────────
function init(){
  updateClock();
  const oggi=new Date().toISOString().slice(0,10);
  // Default: mostra ultimi 30 giorni
  const da=new Date(); da.setDate(da.getDate()-30);
  document.getElementById('f-from').value=da.toISOString().slice(0,10);
  document.getElementById('f-to').value=oggi;
  carica();
  avviaRealtime();
  setInterval(carica,60000);
}

// Auto-init se già loggato
if(sessionStorage.getItem('ranchbar_auth')==='1') init();
</script>
</body>
</html>
