<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--dark:#0f172a;--mid:#1e293b;--accent:#f97316;--green:#22c55e;--gold:#fbbf24;--blue:#3b82f6;--white:#fff;--border:#334155;--text:#e2e8f0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--dark);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
#header{background:#0a0f1e;border-bottom:2px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
#header h1{font-size:1rem;font-weight:900;color:var(--white);}
#sync{font-size:.7rem;padding:3px 8px;border-radius:10px;font-weight:700;margin-left:auto;}
.ok{background:#14532d;color:#4ade80;} .err{background:#4a1a1a;color:#f87171;}

/* STEP INDICATOR */
#steps{display:flex;background:var(--mid);flex-shrink:0;}
.step{flex:1;padding:10px 8px;text-align:center;font-size:.78rem;font-weight:700;color:#475569;border-bottom:3px solid transparent;cursor:pointer;}
.step.active{color:var(--accent);border-bottom-color:var(--accent);}
.step.done{color:var(--green);}
.step-num{display:inline-block;width:20px;height:20px;border-radius:50%;background:#334155;font-size:.7rem;line-height:20px;margin-right:4px;}
.step.active .step-num{background:var(--accent);color:white;}
.step.done .step-num{background:var(--green);color:white;}

/* SCHERMI */
.screen{flex:1;overflow:hidden;display:none;flex-direction:column;}
.screen.active{display:flex;}

/* SCHERMO 1: TAVOLI */
#scr-tavoli{overflow-y:auto;padding:12px;}
.tavoli-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px;}
.banco-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.s-lbl{font-size:.72rem;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700;}
.btn-tv{background:#1e293b;border:2px solid #334155;border-radius:10px;padding:8px 4px;cursor:pointer;text-align:center;color:var(--white);transition:all .15s;}
.btn-tv:hover,.btn-tv.sel{background:var(--accent);border-color:var(--accent);}
.btn-tv .tn{font-size:1rem;font-weight:900;display:block;}
.btn-tv .ts{font-size:.62rem;color:#94a3b8;}
.btn-tv.sel .ts{color:rgba(255,255,255,.8);}

/* SCHERMO 2: PRODOTTI */
#scr-prodotti{}
#topbar{background:var(--mid);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;border-bottom:1px solid var(--border);}
#tavolo-sel-lbl{font-size:.9rem;font-weight:700;color:var(--gold);}
#cart-badge{background:var(--accent);color:white;border-radius:12px;padding:2px 8px;font-size:.75rem;font-weight:900;margin-left:auto;display:none;}
#cat-bar{display:flex;flex-wrap:wrap;background:var(--mid);border-bottom:2px solid var(--border);flex-shrink:0;}
.cat-btn{border:none;background:none;padding:10px 14px;color:#64748b;font-size:.82rem;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.cat-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
#search-wrap{padding:8px 12px;background:var(--mid);flex-shrink:0;}
#search-inp{width:100%;padding:8px 14px;border:1.5px solid var(--border);border-radius:20px;background:#0f172a;color:var(--white);font-size:.9rem;outline:none;}
#search-inp:focus{border-color:var(--accent);}
#prod-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;align-content:start;}
.btn-prod{background:var(--mid);border:1.5px solid var(--border);border-radius:10px;padding:12px 6px;cursor:pointer;text-align:center;transition:all .12s;display:flex;flex-direction:column;gap:5px;}
.btn-prod:active{transform:scale(.96);border-color:var(--accent);}
.btn-prod .pn{font-size:.76rem;font-weight:700;color:var(--text);line-height:1.3;}
.btn-prod .pp{font-size:.95rem;font-weight:900;color:var(--accent);}

/* SCHERMO 3: RIEPILOGO */
#scr-riepilogo{overflow-y:auto;}
#riepilogo-header{padding:12px 16px;background:var(--mid);border-bottom:1px solid var(--border);flex-shrink:0;}
#riepilogo-header h2{font-size:1rem;font-weight:700;}
#riepilogo-tav{color:var(--gold);font-size:.85rem;margin-top:2px;}
#riepilogo-items{flex:1;overflow-y:auto;padding:10px;}
.r-item{display:flex;align-items:center;gap:8px;padding:8px;background:var(--mid);border-radius:9px;margin-bottom:6px;}
.r-qty{background:var(--accent);color:white;border-radius:7px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;flex-shrink:0;}
.r-name{flex:1;font-size:.82rem;font-weight:600;}
.r-cat{font-size:.68rem;color:#64748b;}
.r-price{font-size:.82rem;font-weight:700;color:var(--accent);}
.r-del{background:none;border:none;color:#475569;cursor:pointer;font-size:1rem;padding:4px;}
.r-del:hover{color:#f87171;}
.r-sep{font-size:.7rem;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:8px 0 4px;}
#riepilogo-footer{padding:12px;background:#0a0f1e;border-top:2px solid var(--border);flex-shrink:0;}
#riepilogo-tot{font-size:1.1rem;font-weight:700;text-align:right;margin-bottom:10px;}
#btn-invia-tutto{width:100%;background:linear-gradient(135deg,#ea580c,#f97316);color:white;border:none;border-radius:10px;padding:14px;font-size:1rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
#btn-invia-tutto:disabled{opacity:.5;cursor:not-allowed;}
#btn-invia-tutto.ok{background:linear-gradient(135deg,#16a34a,#22c55e);}
#btn-nuova{width:100%;background:#1e293b;color:#94a3b8;border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:.85rem;font-weight:700;cursor:pointer;margin-top:8px;}

/* BOTTOM NAV */
#botnav{display:flex;background:#0a0f1e;border-top:2px solid var(--border);flex-shrink:0;}
.bnav{flex:1;padding:10px 4px 12px;border:none;background:none;color:#475569;font-size:.62rem;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
.bnav .bico{font-size:1.4rem;}
.bnav.active{color:var(--accent);}
</style>
</head>

// ── NAVIGAZIONE ──────────────────────────────────────────────────
function goScreen(name){
  if(name==='prodotti' && !selectedTavolo){ alert('Seleziona prima un tavolo!'); return; }
  if(name==='riepilogo' && !cart.length){ alert('Aggiungi almeno un prodotto!'); return; }
  ['tavoli','prodotti','riepilogo'].forEach(s=>{
    document.getElementById('scr-'+s).classList.toggle('active', s===name);
    const bn = document.getElementById('bn'+(['tavoli','prodotti','riepilogo'].indexOf(s)+1));
    if(bn) bn.classList.toggle('active', s===name);
    const st = document.getElementById('step'+(['tavoli','prodotti','riepilogo'].indexOf(s)+1));
    if(st) st.classList.toggle('active', s===name);
  });
  if(name==='prodotti') renderProdotti();
  if(name==='riepilogo') renderRiepilogo();
}

// ── TAVOLI ───────────────────────────────────────────────────────
function renderTavoli(){
  const tg=document.getElementById('tv-grid');
  const bg=document.getElementById('banco-grid');
  tg.innerHTML=''; bg.innerHTML='';
  for(let i=1;i<=NUM_TAVOLI;i++){
    const btn=document.createElement('button');
    btn.className='btn-tv'+(selectedTavolo===i?' sel':'');
    btn.innerHTML=`<span class="tn">T${i}</span>`;
    btn.onclick=()=>{selectedTavolo=i;renderTavoli();goScreen('prodotti');};
    tg.appendChild(btn);
  }
  for(let i=1;i<=NUM_BANCO;i++){
    const key='B'+i;
    const btn=document.createElement('button');
    btn.className='btn-tv'+(selectedTavolo===key?' sel':'');
    btn.innerHTML=`<span class="tn">B${i}</span>`;
    btn.onclick=()=>{selectedTavolo=key;renderTavoli();goScreen('prodotti');};
    bg.appendChild(btn);
  }
}

  if(!currentCat) currentCat=cats[0]||'';
  const bar=document.getElementById('cat-bar');
  bar.innerHTML='';
  cats.forEach(c=>{
    const b=document.createElement('button');
    b.className='cat-btn'+(c===currentCat?' active':'');
    b.textContent=({
      "Birre alla Spina":"🍺","Birre in Bottiglia":"🍾","Birre Artigianali":"🏺",
      "Cocktail":"🍹","Superalcolici":"🥃","Vini Rossi":"🍷","Vini Bianchi":"🥂",
      "Vini Rosati":"🌸","Vini Spumanti":"🫧","Analcolici":"🧃","Caffetteria":"☕",
      "Hamburger":"🍔","Panini":"🥖","Pizze Rosse":"🍕","Pizze Bianche":"🫓",
      "Stuzzichini & Antipasti":"🧆","Dolci & Dessert":"🍰","Cucina & Altro":"🍽️",
      "Taglieri":"🧀","Tostoni":"🥪","Insalate":"🥗","Burgers":"🍔","Fritti":"🍟",
      "Dolci":"🍰","Hot Dog & Salsicce":"🌭","Bibite":"🥤","Drinks & Cocktail":"🍹",
      "Dopocena & Amari":"🥃","Grappe Locali":"🫙",
    }[c]||'🍽️')+' '+c;
    b.onclick=()=>{currentCat=c;searchQuery='';document.getElementById('search-inp').value='';renderCatBar();renderProdotti();};
    bar.appendChild(b);
  });
}

// ── PRODOTTI ─────────────────────────────────────────────────────
function renderProdotti(){
  renderCatBar();
  const grid=document.getElementById('prod-grid');
  const lbl=document.getElementById('tavolo-sel-lbl');
  lbl.textContent=String(selectedTavolo).startsWith('B')?'Banco '+String(selectedTavolo).slice(1):'Tavolo '+selectedTavolo;
  const q=searchQuery.toLowerCase();
  const lista=q?prodotti.filter(p=>p.name.toLowerCase().includes(q)):prodotti.filter(p=>p.cat===currentCat);
  grid.innerHTML='';
  lista.forEach(prod=>{
    const b=document.createElement('button');
    b.className='btn-prod';
    b.innerHTML=`<span class="pn">${prod.name}</span><span class="pp">€ ${fmt(prod.price)}</span>`;
    b.onclick=()=>addToCart(prod);
    grid.appendChild(b);
  });
  aggiornaCartBadge();
}

document.getElementById('search-inp').addEventListener('input',function(){
  searchQuery=this.value.trim(); renderProdotti();
});

// ── CART ─────────────────────────────────────────────────────────
function addToCart(prod){
  const ex=cart.find(i=>i.name===prod.name);
  if(ex) ex.qty++;
  else cart.push({name:prod.name,price:prod.price,cat:prod.cat||'',qty:1});
  aggiornaCartBadge();
  // Flash feedback
  renderProdotti();
}

function aggiornaCartBadge(){
  const n=cart.reduce((s,i)=>s+i.qty,0);
  const el=document.getElementById('cart-badge');
  el.textContent=n+' art.';
  el.style.display=n>0?'inline':'none';
}

function removeFromCart(idx){
  cart.splice(idx,1); renderRiepilogo();
}
function cambiaQtyCart(idx,d){
  cart[idx].qty+=d;
  if(cart[idx].qty<=0) cart.splice(idx,1);
  renderRiepilogo();
}

// ── RIEPILOGO ────────────────────────────────────────────────────
function renderRiepilogo(){
  const lbl=document.getElementById('riepilogo-tav');
  lbl.textContent=String(selectedTavolo).startsWith('B')?'Banco '+String(selectedTavolo).slice(1):'Tavolo '+selectedTavolo;

  const container=document.getElementById('riepilogo-items');
  if(!cart.length){ container.innerHTML='<div style="text-align:center;color:#475569;padding:40px;">Nessun prodotto</div>'; return; }

  // Dividi per reparto
  const cucina=cart.filter(i=>CUCINA_CATS.includes(i.cat));
  const bar=cart.filter(i=>BAR_CATS.includes(i.cat));
  const altro=cart.filter(i=>!CUCINA_CATS.includes(i.cat)&&!BAR_CATS.includes(i.cat));

  let html='';
  const renderGruppo=(items,titolo,colore)=>{
    if(!items.length) return '';
    let h=`<div class="r-sep" style="color:${colore}">${titolo}</div>`;
    items.forEach((item,idx)=>{
      const realIdx=cart.indexOf(item);
      h+=`<div class="r-item">
        <span class="r-qty">${item.qty}x</span>
        <div style="flex:1"><div class="r-name">${item.name}</div></div>
        <span class="r-price">€ ${fmt(item.price*item.qty)}</span>
        <button class="r-del" onclick="cambiaQtyCart(${realIdx},-1)">➖</button>
        <button class="r-del" onclick="cambiaQtyCart(${realIdx},1)">➕</button>
      </div>`;
    });
    return h;
  };

  html+=renderGruppo(cucina,'🍳 CUCINA','#f97316');
  html+=renderGruppo(bar,'🍺 BAR','#3b82f6');
  html+=renderGruppo(altro,'📋 ALTRO','#94a3b8');
  container.innerHTML=html;

  const tot=cart.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('riepilogo-tot').textContent='Totale stimato: € '+fmt(tot);
}

// ── INVIO ─────────────────────────────────────────────────────────
async function inviaOrdine(){
  if(!selectedTavolo||!cart.length) return;
  const btn=document.getElementById('btn-invia-tutto');
  btn.disabled=true; btn.textContent='⏳ Invio in corso...';

  const tavolo_label=String(selectedTavolo).startsWith('B')?'Banco '+String(selectedTavolo).slice(1):'Tavolo '+selectedTavolo;
  const gruppo_invio=new Date().toISOString();

  const records=cart.map(item=>{
    const rep=CUCINA_CATS.includes(item.cat)?'cucina':BAR_CATS.includes(item.cat)?'bar':'cucina';
    return {tavolo:String(selectedTavolo),tavolo_label,reparto:rep,articolo:item.name,quantita:item.qty,gruppo_invio,stato:'attesa'};
  });

  try{
    const{error}=await supa.from('ordini_cucina').insert(records);
    if(error) throw error;
    btn.textContent='✅ Ordine inviato!';
    btn.classList.add('ok');
    setTimeout(()=>{
      btn.textContent='📤 Invia a Cucina & Bar';
      btn.classList.remove('ok');
      btn.disabled=false;
    },3000);
  }catch(e){
    alert('❌ Errore: '+e.message);
    btn.textContent='📤 Invia a Cucina & Bar';
    btn.disabled=false;
  }
}

function nuovaComanda(){
  cart=[];
  goScreen('prodotti');
}

// ── SYNC STATUS ───────────────────────────────────────────────────
async function checkSync(){
  try{
    const{error}=await supa.from('ordini_cucina').select('id').limit(1);
    const el=document.getElementById('sync');
    if(error){ el.className='err'; el.textContent='🔴'; }
    else { el.className='ok'; el.textContent='🟢'; }
  }catch(e){ document.getElementById('sync').className='err'; }
}

// ── INIT ──────────────────────────────────────────────────────────
renderTavoli();
renderCatBar();
checkSync();
setInterval(checkSync,30000);
</script>
</body>
